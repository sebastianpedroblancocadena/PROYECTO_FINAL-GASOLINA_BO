<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuelChain Bolivia — Custodia Digital de Combustible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12;
    --panel:#12161D;
    --panel-2:#171C25;
    --border:#232935;
    --border-soft:#1B212B;
    --cyan:#29D3C0;
    --indigo:#6E7BFF;
    --amber:#F5A623;
    --red:#FF4757;
    --green:#35D07F;
    --text:#E7ECF3;
    --muted:#7C8798;
    --muted-2:#4E5867;
    --mono:'IBM Plex Mono', monospace;
    --display:'Space Grotesk', sans-serif;
    --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);height:100%;}
  body{overflow-x:hidden;}
  #app{display:flex;min-height:100vh;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#2A313D;border-radius:4px;}
  a{color:inherit;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px;flex-shrink:0;background:linear-gradient(180deg,#0D1117,#0A0D12);
    border-right:1px solid var(--border);display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;z-index:20;
  }
  .brand{padding:20px 18px 14px;border-bottom:1px solid var(--border-soft);}
  .brand-mark{display:flex;align-items:center;gap:10px;}
  .brand-dot{width:10px;height:10px;border-radius:2px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);}
  .brand-title{font-family:var(--display);font-weight:700;font-size:15.5px;letter-spacing:0.5px;}
  .brand-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-top:4px;text-transform:uppercase;}
  .nav{padding:14px 10px;flex:1;overflow-y:auto;}
  .nav-group-label{font-family:var(--mono);font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:1.2px;padding:12px 10px 6px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;
    font-size:13.5px;color:var(--muted);cursor:pointer;margin-bottom:2px;border:1px solid transparent;
    transition:background .12s,color .12s;
  }
  .nav-item svg{width:15px;height:15px;flex-shrink:0;}
  .nav-item:hover{background:var(--panel-2);color:var(--text);}
  .nav-item.active{background:rgba(41,211,192,0.08);color:var(--cyan);border-color:rgba(41,211,192,0.25);}
  .nav-badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--red);color:#fff;padding:1px 6px;border-radius:10px;}
  .sidebar-footer{padding:12px 14px;border-top:1px solid var(--border-soft);font-family:var(--mono);font-size:10px;color:var(--muted-2);}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;
    padding:0 20px;gap:16px;position:sticky;top:0;background:rgba(10,13,18,0.85);backdrop-filter:blur(8px);z-index:10;
  }
  .topbar-title{font-family:var(--display);font-weight:600;font-size:15px;}
  .topbar-sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
  .status-pills{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
  .pill{
    display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:var(--panel-2);
    border:1px solid var(--border);font-family:var(--mono);font-size:10.5px;color:var(--muted);
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
  .pill.down .dot{background:var(--red);box-shadow:0 0 6px var(--red);}
  .content{padding:22px 26px 60px;max-width:1400px;width:100%;}

  h1.page-title{font-family:var(--display);font-size:20px;margin:0 0 4px;}
  p.page-desc{color:var(--muted);font-size:13px;margin:0 0 20px;max-width:720px;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:14px;}
  .grid-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
  .grid-2{grid-template-columns:2fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;
  }
  .card-title{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
  .kpi-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;}
  .kpi-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .kpi-value{font-family:var(--display);font-size:26px;font-weight:700;margin-top:6px;}
  .kpi-accent{position:absolute;top:0;right:0;bottom:0;width:3px;}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--body);font-weight:600;font-size:13px;padding:9px 16px;border-radius:7px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);cursor:pointer;transition:transform .08s, background .12s;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{background:#1E2530;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:linear-gradient(135deg,var(--cyan),#1CA89B);border-color:transparent;color:#03211E;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-danger{background:linear-gradient(135deg,var(--red),#C93244);border-color:transparent;color:#fff;}
  .btn-warn{background:linear-gradient(135deg,var(--amber),#C97D12);border-color:transparent;color:#241500;}
  .btn-indigo{background:linear-gradient(135deg,var(--indigo),#4C58D0);border-color:transparent;color:#fff;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  /* ---------- Badges ---------- */
  .badge{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:20px;letter-spacing:0.4px;display:inline-block;white-space:nowrap;}
  .badge-created{background:rgba(110,123,255,0.14);color:var(--indigo);}
  .badge-transit{background:rgba(41,211,192,0.14);color:var(--cyan);}
  .badge-warning{background:rgba(245,166,35,0.14);color:var(--amber);}
  .badge-blocked{background:rgba(255,71,87,0.14);color:var(--red);}
  .badge-dest{background:rgba(53,208,127,0.14);color:var(--green);}
  .badge-auth{background:rgba(53,208,127,0.14);color:var(--green);}
  .badge-delivered{background:rgba(53,208,127,0.2);color:var(--green);}
  .badge-critica{background:rgba(255,71,87,0.16);color:var(--red);}
  .badge-warning-sev{background:rgba(245,166,35,0.16);color:var(--amber);}
  .badge-info{background:rgba(124,135,152,0.18);color:var(--muted);}

  /* ---------- Table ---------- */
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);}
  td{padding:9px 10px;border-bottom:1px solid var(--border-soft);font-family:var(--mono);color:var(--text);}
  tr:hover td{background:rgba(255,255,255,0.015);}
  .table-wrap{overflow:auto;max-height:460px;border:1px solid var(--border);border-radius:8px;}
  .empty-state{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;}
  .empty-state .icon{font-size:26px;margin-bottom:8px;}

  /* ---------- Tabs / segmented ---------- */
  .segmented{display:flex;gap:6px;background:var(--panel-2);padding:4px;border-radius:8px;border:1px solid var(--border);width:fit-content;margin-bottom:16px;flex-wrap:wrap;}
  .segmented button{border:none;background:transparent;color:var(--muted);font-family:var(--mono);font-size:11.5px;padding:6px 12px;border-radius:6px;cursor:pointer;}
  .segmented button.active{background:var(--panel);color:var(--cyan);}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(5,7,10,0.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:100%;max-width:480px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .modal h3{font-family:var(--display);margin:0 0 4px;font-size:17px;}
  .modal p.hint{color:var(--muted);font-size:12.5px;margin:0 0 16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:5px;}
  .field input,.field select{
    width:100%;background:#0D1117;border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:6px;font-size:13px;font-family:var(--body);
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--cyan);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  /* ---------- Toast ---------- */
  #toast-stack{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px;}
  .toast{
    background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:8px;
    padding:12px 14px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,0.4);animation:slideIn .2s ease;
  }
  .toast.success{border-left-color:var(--green);}
  .toast.error{border-left-color:var(--red);}
  .toast.warn{border-left-color:var(--amber);}
  .toast b{display:block;font-family:var(--display);font-size:12.5px;margin-bottom:2px;}
  @keyframes slideIn{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}

  /* ---------- Custody chain (signature element) ---------- */
  .chain-strip{display:flex;align-items:center;overflow-x:auto;padding:10px 4px 16px;gap:0;}
  .chain-block{
    flex-shrink:0;width:150px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;
    position:relative;
  }
  .chain-block.genesis{border-color:var(--indigo);}
  .chain-block.tamper{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;}
  .chain-block .num{font-family:var(--mono);font-size:9.5px;color:var(--muted);}
  .chain-block .ev{font-family:var(--display);font-size:12px;margin:3px 0 6px;color:var(--text);}
  .chain-block .h{font-family:var(--mono);font-size:9.5px;color:var(--cyan);word-break:break-all;}
  .chain-link{width:26px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--indigo));flex-shrink:0;position:relative;}
  .chain-link::after{content:'';position:absolute;right:-3px;top:-2px;width:6px;height:6px;border-radius:50%;background:var(--indigo);}

  /* ---------- Map ---------- */
  .map-wrap{background:#0D1117;border:1px solid var(--border);border-radius:8px;padding:10px;}
  .map-legend{display:flex;gap:14px;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted);flex-wrap:wrap;}
  .map-legend span{display:flex;align-items:center;gap:5px;}
  .map-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* ---------- Timeline ---------- */
  .timeline{position:relative;padding-left:26px;}
  .timeline::before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:1px;background:var(--border);}
  .t-item{position:relative;padding-bottom:20px;}
  .t-dot{position:absolute;left:-26px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--cyan);}
  .t-item.crit .t-dot{border-color:var(--red);}
  .t-item.warn .t-dot{border-color:var(--amber);}
  .t-item.ok .t-dot{border-color:var(--green);}
  .t-title{font-family:var(--display);font-size:13px;}
  .t-meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;}
  .t-desc{font-size:12.5px;color:var(--muted);margin-top:3px;}

  /* ---------- Attack flow ---------- */
  .flow{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:360px;margin:0 auto;}
  .flow-step{
    width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:center;
    font-family:var(--mono);font-size:12px;opacity:0.25;transition:opacity .25s, border-color .25s, background .25s;
  }
  .flow-step.active{opacity:1;border-color:var(--cyan);}
  .flow-step.fail{opacity:1;border-color:var(--red);background:rgba(255,71,87,0.08);color:var(--red);}
  .flow-arrow{color:var(--muted-2);font-size:16px;}

  .checklist-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-family:var(--mono);font-size:13px;opacity:0.25;transition:opacity .2s;}
  .checklist-item.active{opacity:1;}
  .checklist-item .ico{width:18px;}

  .section-hidden{display:none;}
  .muted{color:var(--muted);}
  .mono{font-family:var(--mono);}
  .flex-between{display:flex;align-items:center;justify-content:space-between;}
  .small{font-size:11px;}
  .divider{height:1px;background:var(--border-soft);margin:14px 0;}
  code.inline{background:#0D1117;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:11.5px;border:1px solid var(--border);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-stack"></div>

<script>
/* =========================================================================
   FUELCHAIN BOLIVIA — CONTROL CENTER (single-file web demo)
   Puerto web funcional del prototipo de consola original.
   - "Base de datos" -> arreglos en memoria persistidos con window.storage
   - "Blockchain"    -> cadena de hashes SHA-256 real (Web Crypto API)
   - "HSM"           -> SIMULACIÓN CRIPTOGRÁFICA PARA DEMOSTRACIÓN (no es HSM físico)
   ========================================================================= */

const STORAGE_KEY = 'fuelchain:state:v1';
const HSM_KEY = 'HSM_FUELCHAIN_YPFB_ANH_DEMO'; // clave de demo, NO usar en producción

let state = null;
let currentTab = 'dashboard';
let selectedDbTable = 'envios';
let busy = false; // bloquea acciones concurrentes durante animaciones

/* ----------------------------- utilidades ----------------------------- */
function nowStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function fmt(n){ return Number(n).toLocaleString('es-BO',{maximumFractionDigits:2}); }
function truncHash(h,n=18){ return h ? (h.slice(0,n)+'…') : ''; }
function codeEnvio(id){ return 'ENV-'+String(id).padStart(4,'0'); }
function stableStringify(v){
  if (v===null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '['+v.map(stableStringify).join(',')+']';
  const keys = Object.keys(v).sort();
  return '{'+keys.map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';
}
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function generarFirma(datos){
  return sha256Hex(stableStringify(datos)+HSM_KEY);
}
async function verificarFirma(datos, firma){
  return (await generarFirma(datos)) === firma;
}
function toast(title, msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.innerHTML = `<b>${title}</b>${msg||''}`;
  document.getElementById('toast-stack').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 4200);
}

/* ----------------------------- persistencia -----------------------------
   Si la app corre dentro del entorno de artifacts de Claude.ai usa
   window.storage. Si se abrió como archivo HTML descargado/local (donde
   window.storage no existe), usa localStorage del navegador como
   alternativa equivalente, sin perder funcionalidad. */
const HAS_ARTIFACT_STORAGE = (typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function');
let storageWarned = false;

async function saveState(){
  const payload = JSON.stringify(state);
  if(HAS_ARTIFACT_STORAGE){
    try{ await window.storage.set(STORAGE_KEY, payload, false); return; }
    catch(e){ console.warn('window.storage falló, usando localStorage', e); }
  }
  try{ localStorage.setItem(STORAGE_KEY, payload); }
  catch(e){
    console.error('Error guardando estado', e);
    if(!storageWarned){ storageWarned = true; toast('Error de almacenamiento','No se pudo guardar el estado en este navegador (¿modo privado?).','error'); }
  }
}
async function loadState(){
  if(HAS_ARTIFACT_STORAGE){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){ state = JSON.parse(res.value); return true; }
    }catch(e){ /* clave inexistente u otro error: seguimos con el respaldo local */ }
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); return true; }
  }catch(e){ /* localStorage no disponible */ }
  return false;
}

/* ----------------------------- semilla demo ----------------------------- */
async function seedDemo(){
  state = {
    camiones: [{id:1, placa:'TRUCK-LPZ-001', conductor:'Conductor Demo', capacidad:20000, estado:'DISPONIBLE', fecha_registro:nowStr()}],
    envios: [],
    sensores: [],
    eventos: [],
    bloques: [],
    activeEnvioId: null,
    nextIds: {camion:2, envio:1, sensor:1, evento:1},
    system: {sensores:true, hsm:true, blockchain:true, sqlite:true, api:true}
  };
  await saveState();
}

/* ----------------------------- capa blockchain ----------------------------- */
async function crearBloque(evento, datos){
  const numero = state.bloques.length;
  const hash_anterior = numero===0 ? 'GENESIS' : state.bloques[numero-1].hash_actual;
  const fecha = nowStr();
  const info = {numero, evento, datos, hash_anterior, fecha};
  const hash_actual = await sha256Hex(stableStringify(info));
  const bloque = {numero, evento, datos, hash_anterior, hash_actual, fecha};
  state.bloques.push(bloque);
  return bloque;
}
async function verificarIntegridadBlockchain(){
  const bloques = state.bloques;
  if(bloques.length===0) return {ok:true, detalle:'Blockchain vacía — nada que verificar.', fallo:null};
  let esperado = 'GENESIS';
  for(const b of bloques){
    const info = {numero:b.numero, evento:b.evento, datos:b.datos, hash_anterior:b.hash_anterior, fecha:b.fecha};
    const calc = await sha256Hex(stableStringify(info));
    if(b.hash_anterior !== esperado){
      return {ok:false, detalle:`Bloque #${b.numero}: hash_anterior no coincide con el hash del bloque previo.`, fallo:b.numero};
    }
    if(calc !== b.hash_actual){
      return {ok:false, detalle:`Bloque #${b.numero}: el hash almacenado no corresponde a su contenido (posible alteración).`, fallo:b.numero};
    }
    esperado = b.hash_actual;
  }
  return {ok:true, detalle:`Se verificaron ${bloques.length} bloques. Cadena consistente.`, fallo:null};
}

/* ----------------------------- lógica de negocio ----------------------------- */
function getCamionByPlaca(placa){ return state.camiones.find(c=>c.placa===placa); }
function ensureCamion(placa, conductor, capacidad){
  let c = getCamionByPlaca(placa);
  if(c) return c;
  c = {id: state.nextIds.camion++, placa, conductor: conductor||'Conductor Demo', capacidad: capacidad||20000, estado:'DISPONIBLE', fecha_registro: nowStr()};
  state.camiones.push(c);
  return c;
}
function getEnvio(id){ return state.envios.find(e=>e.id===id); }
function activeEnvio(){ return state.activeEnvioId ? getEnvio(state.activeEnvioId) : null; }

async function crearLote({placa, conductor, origen, destino, volumen}){
  const camion = ensureCamion(placa, conductor, 20000);
  const envio = {
    id: state.nextIds.envio++,
    camion_id: camion.id,
    camion: camion.placa,
    origen, destino,
    volumen_inicial: volumen,
    volumen_actual: volumen,
    estado: 'CREATED',
    fecha: nowStr()
  };
  state.envios.push(envio);
  state.activeEnvioId = envio.id;
  const bloque = await crearBloque('MINT_FUEL_BATCH', {
    envio_id: envio.id, camion: camion.placa, origen, destino, volumen
  });
  await saveState();
  return {envio, bloque};
}

function generarAlerta(envio_id, descripcion, tipo, severidad){
  const ev = {id: state.nextIds.evento++, envio_id, tipo, descripcion, severidad, estado:'OPEN', fecha: nowStr()};
  state.eventos.push(ev);
  return ev;
}

/* NOTA: en el código original, "El Alto" y "Estación destino" compartían
   exactamente las mismas coordenadas, lo que hacía que el marcador del
   camión pareciera "congelado" en el último tramo del viaje (ambos puntos
   caían en el mismo pixel del mapa). Se corrige aquí dando a la estación
   de destino una coordenada propia, cercana a La Paz, preservando el
   mismo recorrido conceptual Senkata → El Alto → Autopista → La Paz → Destino. */
const RUTA = [
  {nombre:'Senkata', lat:-16.515, lon:-68.193},
  {nombre:'El Alto', lat:-16.500, lon:-68.150},
  {nombre:'Autopista', lat:-16.510, lon:-68.140},
  {nombre:'La Paz', lat:-16.495, lon:-68.145},
  {nombre:'Estación destino', lat:-16.488, lon:-68.132},
];

async function simularViajePaso(idx, envio, onStep){
  const punto = RUTA[idx];
  await sleep(550);
  const perdida = Math.floor(10 + Math.random()*20);
  envio.volumen_actual = Math.max(0, envio.volumen_actual - perdida);
  const densidad = +(0.735 + Math.random()*0.01).toFixed(3);
  const temperatura = +(18 + Math.random()*4).toFixed(1);
  const datosLectura = {
    envio_id: envio.id, camion: envio.camion, volumen: envio.volumen_actual,
    densidad, temperatura, latitud: punto.lat, longitud: punto.lon
  };
  const firma = await generarFirma(datosLectura);
  const lectura = {id: state.nextIds.sensor++, ...datosLectura, firma, fecha: nowStr(), punto: punto.nombre};
  state.sensores.push(lectura);
  const bloque = await crearBloque('SENSOR_READING', datosLectura);
  envio.estado = (idx === RUTA.length-1) ? 'AT_DESTINATION' : 'IN_TRANSIT';
  await saveState();
  if(onStep) onStep(idx, lectura, bloque);
}

async function simularOrdeno(envio){
  const volumen_esperado = envio.volumen_actual;
  await sleep(700);
  const volumen_detectado = Math.max(0, volumen_esperado - 4000);
  const diferencia = volumen_esperado - volumen_detectado;
  let anomalia = false, bloque = null, alerta = null;
  if(diferencia > 1000){
    anomalia = true;
    envio.volumen_actual = volumen_detectado;
    envio.estado = 'BLOCKED';
    alerta = generarAlerta(envio.id, 'Variación anormal de volumen detectada', 'SUSPECTED_TAMPER', 'CRITICA');
    bloque = await crearBloque('SUSPECTED_TAMPER', {
      envio_id: envio.id, camion: envio.camion, volumen_esperado, volumen_detectado, diferencia, accion:'DELIVERY_BLOCKED'
    });
  }
  await saveState();
  return {volumen_esperado, volumen_detectado, diferencia, anomalia, bloque, alerta};
}

async function simularAtaqueSensor(envio, updateFlow){
  updateFlow(0); await sleep(500);
  const datosOriginales = {
    envio_id: envio.id, camion: envio.camion, volumen: envio.volumen_actual,
    densidad: 0.740, temperatura: 20.0, latitud: -16.510, longitud: -68.140
  };
  const firmaOriginal = await generarFirma(datosOriginales);
  updateFlow(1); await sleep(600);
  updateFlow(2); await sleep(700);
  const datosModificados = {...datosOriginales, volumen: 20000};
  updateFlow(3); await sleep(700);
  const firmaValida = await verificarFirma(datosModificados, firmaOriginal);
  updateFlow(4); await sleep(500);
  let bloque=null, alerta=null;
  if(!firmaValida){
    envio.estado = 'BLOCKED';
    alerta = generarAlerta(envio.id, 'Intento de manipulación de datos del sensor', 'HSM_SIGNATURE_FAILURE', 'CRITICA');
    bloque = await crearBloque('HSM_SIGNATURE_FAILURE', {
      envio_id: envio.id, camion: envio.camion, evento:'HSM_SIGNATURE_FAILURE', accion:'DELIVERY_BLOCKED'
    });
    updateFlow(5);
  } else {
    updateFlow('ok');
  }
  await saveState();
  return {firmaValida, datosOriginales, datosModificados, firmaOriginal, bloque, alerta};
}

async function ejecutarEntrega(envio, onCheck){
  const bloqueado = envio.estado === 'BLOCKED';
  const checks = {
    gps: true,
    tanque: true,
    firma: !bloqueado,
    precinto: !bloqueado
  };
  const order = ['gps','tanque','firma','precinto'];
  for(const k of order){ await sleep(450); onCheck(k, checks[k]); }
  await sleep(300);
  const autorizado = Object.values(checks).every(Boolean);
  envio.estado = autorizado ? 'DELIVERED' : 'BLOCKED';
  const bloque = await crearBloque(autorizado ? 'DELIVERY_AUTHORIZED' : 'DELIVERY_BLOCKED', {
    envio_id: envio.id, camion: envio.camion, destino: envio.destino, estado: envio.estado
  });
  await saveState();
  return {autorizado, checks, bloque};
}

function alterarBloqueDemo(){
  if(state.bloques.length===0) return null;
  const idx = state.bloques.length - 1;
  const b = state.bloques[idx];
  b.datos = {...b.datos, volumen: (b.datos.volumen||0) + 9999, _alterado_manualmente: true};
  b._tampered = true;
  return b;
}

function projectPoint(lat, lon, W, H){
  const lats = RUTA.map(p=>p.lat), lons = RUTA.map(p=>p.lon);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats), minLon=Math.min(...lons), maxLon=Math.max(...lons);
  const pad = 40;
  const x = pad + ((lon-minLon)/((maxLon-minLon)||1))*(W-2*pad);
  const y = H - pad - ((lat-minLat)/((maxLat-minLat)||1))*(H-2*pad);
  return {x,y};
}

    </div>

function miniChart(title, values, color){
  const W=340,H=110,pad=10;
  let body;
  if(!values || values.length<2){
    body = `<div class="empty-state small" style="padding:24px 10px;">Sin datos suficientes.</div>`;
  } else {
    const min=Math.min(...values), max=Math.max(...values);
    const range = (max-min)||1;
    const pts = values.map((v,i)=>{
      const x = pad + (i/(values.length-1))*(W-2*pad);
      const y = H-pad - ((v-min)/range)*(H-2*pad);
      return `${x},${y}`;
    }).join(' ');
    body = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;">
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>
      ${values.map((v,i)=>{
        const x = pad + (i/(values.length-1))*(W-2*pad);
        const y = H-pad - ((v-min)/range)*(H-2*pad);
        return `<circle cx="${x}" cy="${y}" r="2.5" fill="${color}"/>`;
      }).join('')}
    </svg>`;
  }
  return `<div class="card"><div class="card-title">${title}</div>${body}</div>`;
}

async function iniciarSimulacionViaje(){
  const env = activeEnvio();
  if(!env || busy) return;
  busy = true;
  // Limpiar lecturas previas de este envío para que una nueva corrida
  // de la simulación anime el recorrido desde el inicio.
  state.sensores = state.sensores.filter(s=>s.envio_id!==env.id);
  env.volumen_actual = env.volumen_inicial;
  env.estado='IN_TRANSIT'; await saveState(); render();
  for(let i=0;i<RUTA.length;i++){
    await simularViajePaso(i, env, ()=>{ renderContent(); });
  }
  busy = false;
  toast('Transporte finalizado', `Volumen final: ${fmt(env.volumen_actual)} L`, 'success');
  renderContent();
}

async function runAtaque(){
  const env = activeEnvio(); if(!env||busy) return;
  busy = true; renderContent();
  const steps = document.querySelectorAll('#attack-flow .flow-step');
  const updateFlow = (i)=>{
    steps.forEach(s=>s.classList.remove('active'));
    if(i==='ok'){ steps[2].classList.add('active'); return; }
    for(let k=0;k<=i;k++){ if(steps[k]) steps[k].classList.add('active'); }
    if(i===5 && steps[5]) steps[5].classList.add('fail');
  };
  const r = await simularAtaqueSensor(env, updateFlow);
  busy = false;
  renderContent();
  if(!r.firmaValida) toast('TRANSACCIÓN RECHAZADA', 'Firma inválida — datos manipulados. Entrega bloqueada.', 'error');

    logDemo(r.firmaValida ? '🟢 Firma válida' : '🚨 Firma inválida — manipulación detectada');
  } else {
    logDemo('🟢 Sensores dentro de rango normal');
  }
  const entrega = await ejecutarEntrega(envio, ()=>{});
  logDemo(entrega.autorizado ? '🟢 Dual Handshake correcto → Entrega AUTORIZADA' : '🔴 Dual Handshake falló → Entrega BLOQUEADA');
  const integridad = await verificarIntegridadBlockchain();
  logDemo(integridad.ok ? '🔐 Blockchain íntegra' : '⚠️ Blockchain alterada');
  busy = false;
  renderContent();
}
async function resetDemo(){
  busy=false;
  await seedDemo();
  toast('Demostración reiniciada', 'Se restauraron los datos iniciales.', 'success');
  render();
}

/* ============================== INIT ============================== */
(async function main(){
  const loaded = await loadState();
  if(!loaded || !state) await seedDemo();
  render();
})();
</script>
